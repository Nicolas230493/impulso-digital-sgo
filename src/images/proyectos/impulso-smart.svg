<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Ilustración de la interfaz de Impulso Smart">
  <defs>
    <linearGradient id="g-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="g-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- Ventana -->
  <rect width="800" height="560" rx="18" fill="#0D1121"/>
  <rect x="0.5" y="0.5" width="799" height="559" rx="18" fill="none" stroke="#1E2950"/>
  <rect width="800" height="44" rx="18" fill="#05070F"/>
  <rect y="26" width="800" height="18" fill="#05070F"/>
  <circle cx="24" cy="22" r="6" fill="#EF4444" opacity=".6"/>
  <circle cx="44" cy="22" r="6" fill="#EAB308" opacity=".6"/>
  <circle cx="64" cy="22" r="6" fill="#10B981" opacity=".6"/>
  <rect x="250" y="12" width="300" height="20" rx="10" fill="#0D1121" stroke="#1E2950"/>
  <text x="400" y="26" text-anchor="middle" font-size="11" fill="#94A3B8">impulso-smart · punto de venta</text>

  <!-- Barra lateral -->
  <rect x="0" y="44" width="72" height="516" fill="#080B17"/>
  <rect x="18" y="64" width="36" height="36" rx="10" fill="url(#g-accent)"/>
  <text x="36" y="88" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">IS</text>
  <g fill="#1E2950">
    <rect x="22" y="130" width="28" height="28" rx="8" fill="#06B6D4" opacity=".2"/>
    <rect x="22" y="176" width="28" height="28" rx="8"/>
    <rect x="22" y="222" width="28" height="28" rx="8"/>
    <rect x="22" y="268" width="28" height="28" rx="8"/>
  </g>

  <!-- Encabezado -->
  <text x="96" y="84" font-size="20" font-weight="800" fill="#fff">Nueva venta</text>
  <rect x="96" y="100" width="380" height="36" rx="10" fill="#05070F" stroke="#1E2950"/>
  <text x="114" y="123" font-size="12" fill="#64748B">Buscar producto o escanear código…</text>

  <!-- Grilla de productos -->
  <g font-size="12">
    <g transform="translate(96 152)">
      <rect width="118" height="96" rx="12" fill="#05070F" stroke="#1E2950"/>
      <rect x="12" y="12" width="32" height="32" rx="8" fill="#06B6D4" opacity=".25"/>
      <text x="12" y="66" fill="#E2E8F0" font-weight="700">Producto A</text>
      <text x="12" y="84" fill="#06B6D4" font-weight="700">$ 2.500</text>
    </g>
    <g transform="translate(227 152)">
      <rect width="118" height="96" rx="12" fill="#05070F" stroke="#06B6D4"/>
      <rect x="12" y="12" width="32" height="32" rx="8" fill="#818CF8" opacity=".25"/>
      <text x="12" y="66" fill="#E2E8F0" font-weight="700">Producto B</text>
      <text x="12" y="84" fill="#06B6D4" font-weight="700">$ 1.200</text>
    </g>
    <g transform="translate(358 152)">
      <rect width="118" height="96" rx="12" fill="#05070F" stroke="#1E2950"/>
      <rect x="12" y="12" width="32" height="32" rx="8" fill="#10B981" opacity=".25"/>
      <text x="12" y="66" fill="#E2E8F0" font-weight="700">Producto C</text>
      <text x="12" y="84" fill="#06B6D4" font-weight="700">$ 4.800</text>
    </g>
    <g transform="translate(96 260)">
      <rect width="118" height="96" rx="12" fill="#05070F" stroke="#1E2950"/>
      <rect x="12" y="12" width="32" height="32" rx="8" fill="#2563EB" opacity=".3"/>
      <text x="12" y="66" fill="#E2E8F0" font-weight="700">Producto D</text>
      <text x="12" y="84" fill="#06B6D4" font-weight="700">$ 950</text>
    </g>
    <g transform="translate(227 260)">
      <rect width="118" height="96" rx="12" fill="#05070F" stroke="#1E2950"/>
      <rect x="12" y="12" width="32" height="32" rx="8" fill="#06B6D4" opacity=".25"/>
      <text x="12" y="66" fill="#E2E8F0" font-weight="700">Producto E</text>
      <text x="12" y="84" fill="#06B6D4" font-weight="700">$ 3.100</text>
    </g>
    <g transform="translate(358 260)">
      <rect width="118" height="96" rx="12" fill="#05070F" stroke="#1E2950"/>
      <rect x="12" y="12" width="32" height="32" rx="8" fill="#818CF8" opacity=".25"/>
      <text x="12" y="66" fill="#E2E8F0" font-weight="700">Producto F</text>
      <text x="12" y="84" fill="#06B6D4" font-weight="700">$ 1.750</text>
    </g>
  </g>

  <!-- Mini gráfico de ventas -->
  <g transform="translate(96 372)">
    <rect width="380" height="160" rx="12" fill="#05070F" stroke="#1E2950"/>
    <text x="16" y="28" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">VENTAS DE LA SEMANA</text>
    <g fill="#1E2950">
      <rect x="24" y="100" width="34" height="40" rx="4"/>
      <rect x="74" y="84" width="34" height="56" rx="4"/>
      <rect x="124" y="92" width="34" height="48" rx="4"/>
      <rect x="174" y="70" width="34" height="70" rx="4"/>
      <rect x="224" y="76" width="34" height="64" rx="4"/>
      <rect x="274" y="56" width="34" height="84" rx="4"/>
      <rect x="324" y="44" width="34" height="96" rx="4" fill="url(#g-bar)"/>
    </g>
  </g>

  <!-- Ticket / carrito -->
  <g transform="translate(500 64)">
    <rect width="276" height="468" rx="14" fill="#05070F" stroke="#1E2950"/>
    <text x="20" y="36" font-size="15" font-weight="800" fill="#fff">Ticket actual</text>
    <g font-size="12" fill="#CBD5E1">
      <text x="20" y="78">2 × Producto B</text><text x="256" y="78" text-anchor="end">$ 2.400</text>
      <line x1="20" y1="92" x2="256" y2="92" stroke="#1E2950"/>
      <text x="20" y="116">1 × Producto C</text><text x="256" y="116" text-anchor="end">$ 4.800</text>
      <line x1="20" y1="130" x2="256" y2="130" stroke="#1E2950"/>
      <text x="20" y="154">3 × Producto D</text><text x="256" y="154" text-anchor="end">$ 2.850</text>
      <line x1="20" y1="168" x2="256" y2="168" stroke="#1E2950"/>
    </g>
    <rect x="20" y="300" width="236" height="64" rx="10" fill="#0D1121"/>
    <text x="36" y="326" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">TOTAL</text>
    <text x="240" y="352" text-anchor="end" font-size="24" font-weight="800" fill="#fff">$ 10.050</text>
    <rect x="20" y="384" width="236" height="48" rx="10" fill="url(#g-accent)"/>
    <text x="138" y="414" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">Cobrar</text>
  </g>
</svg>
